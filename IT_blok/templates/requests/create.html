{% extends 'base.html' %}

{% block title %}Новый запрос{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex align-items-center mb-4">
        <a href="{% url 'requests:list' %}" class="btn btn-outline-secondary me-3">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="mb-0">
            <i class="fas fa-plus-circle" style="color: #8DA0AE;"></i>
            Новый запрос админам
        </h1>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Тема запроса <span class="text-danger">*</span></label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Описание <span class="text-danger">*</span></label>
                    <textarea name="description" class="form-control" rows="5" required></textarea>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'requests:list' %}" class="btn btn-secondary">Отмена</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Отправить
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
