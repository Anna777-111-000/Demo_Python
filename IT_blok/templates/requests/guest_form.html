{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex align-items-center mb-4">
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary me-3">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="mb-0">
            <i class="fas {{ icon }}" style="color: #8DA0AE;"></i>
            {{ title }}
        </h1>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0">Создание запроса</h5>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Тип запроса</label>
                    <select name="request_type" class="form-select" required>
                        <option value="">-- Выберите тип запроса --</option>
                        {% for value, label in form.request_type.field.choices %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Описание</label>
                    <textarea name="description" class="form-control" rows="5" placeholder="Опишите подробно ваш запрос..." required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Срочность</label>
                    <select name="priority" class="form-select">
                        <option value="low">🟢 Низкая</option>
                        <option value="medium" selected>🟡 Средняя</option>
                        <option value="high">🔴 Высокая</option>
                        <option value="urgent">⚠️ Срочная</option>
                    </select>
                </div>

                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i>
                    Запрос будет отправлен. Вы получите уведомление о решении.
                </div>
                
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Отмена</a>
                    <button type="submit" class="btn btn-primary">Отправить запрос</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
