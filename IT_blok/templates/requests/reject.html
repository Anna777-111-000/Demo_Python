{% extends 'base.html' %}

{% block title %}Отклонение запроса #{{ request.id }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex align-items-center mb-4">
        <a href="{% url 'requests:detail' request.id %}" class="btn btn-outline-secondary me-3">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="mb-0">Отклонение запроса #{{ request.id }}</h1>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Причина отклонения <span class="text-danger">*</span></label>
                    <textarea name="reason" class="form-control" rows="4" required></textarea>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'requests:detail' request.id %}" class="btn btn-secondary">Отмена</a>
                    <button type="submit" class="btn btn-danger">Отклонить запрос</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
