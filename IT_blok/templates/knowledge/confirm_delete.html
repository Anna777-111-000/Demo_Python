{% extends 'base.html' %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 text-danger">Подтверждение удаления</h5>
                </div>
                <div class="card-body text-center py-4">
                    <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #dc3545;"></i>
                    <h4 class="mt-3">Вы уверены, что хотите удалить статью?</h4>
                    <p class="text-muted"><strong>{{ article.title }}</strong></p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2">
                            <a href="{% url 'knowledge:detail' article.id %}" class="btn btn-secondary">Отмена</a>
                            <button type="submit" class="btn btn-danger">Удалить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
