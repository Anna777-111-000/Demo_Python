{% extends 'base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0"><i class="fas fa-question-circle"></i> Восстановление пароля</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">Введите ваш Telegram-ник, на который будет отправлен временный пароль.</p>
                    <form method="post" id="resetForm">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Telegram ник</label>
                            <input type="text" name="tg_nick" class="form-control" placeholder="@username" required>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/accounts/login/" class="btn btn-secondary">Вернуться ко входу</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-paper-plane"></i> Отправить пароль
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
