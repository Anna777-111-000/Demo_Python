{% extends 'base.html' %}

{% block title %}Предложение{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex align-items-center mb-4">
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary me-3">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="mb-0">
            <i class="fas fa-lightbulb" style="color: #8DA0AE;"></i>
            Ваше предложение
        </h1>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Предложение</label>
                    <textarea name="suggestion" class="form-control" rows="5" placeholder="Опишите вашу идею..." required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Важность</label>
                    <select name="priority" class="form-select">
                        <option value="low">🟢 Низкая</option>
                        <option value="medium" selected>🟡 Средняя</option>
                        <option value="high">🔴 Высокая</option>
                        <option value="urgent">⚠️ Срочная</option>
                    </select>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Отмена</a>
                    <button type="submit" class="btn btn-primary">Отправить</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
