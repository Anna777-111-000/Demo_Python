{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex align-items-center mb-4">
        <a href="{% url 'accounts:employee_list' %}" class="btn btn-outline-secondary me-3">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="mb-0">
            <i class="fas fa-user-plus" style="color: #8DA0AE;"></i>
            {{ title }}
        </h1>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form id="employeeForm" method="post">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">ФИО <span class="text-danger">*</span></label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Логин (username)</label>
                        <input type="text" name="username" class="form-control" placeholder="Оставьте пустым для автогенерации">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Корпоративная почта <span class="text-danger">*</span></label>
                        <input type="email" name="corporate_email" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Личная почта</label>
                        <input type="email" name="personal_email" class="form-control">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Telegram (ник)</label>
                        <input type="text" name="tg_nick" class="form-control" placeholder="@username">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Телефон</label>
                        <input type="tel" name="phone" class="form-control" placeholder="+7 (999) 123-45-67">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Отдел</label>
                        <select name="department" class="form-select">
                            <option value="it">IT-блок</option>
                            <option value="hr">HR</option>
                            <option value="finance">Финансы</option>
                            <option value="marketing">Маркетинг</option>
                            <option value="sales">Продажи</option>
                            <option value="other">Другое</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Должность</label>
                        <input type="text" name="position" class="form-control" value="Сотрудник">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Основная роль</label>
                    <select name="primary_role" class="form-select">
                        <option value="">— Выберите роль —</option>
                        {% for role in roles %}
                        <option value="{{ role.id }}">{{ role.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'accounts:employee_list' %}" class="btn btn-secondary">Отмена</a>
                    <button type="submit" class="btn btn-primary">Создать и настроить права</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('employeeForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const formData = new FormData(this);
        const response = await fetch('', {
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': getCookie('csrftoken') }
        });

        const data = await response.json();

        if (data.success) {
            window.location.href = `/accounts/employees/${data.employee_id}/permissions/`;
        } else {
            alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
        }
    });

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
{% endblock %}
