{% extends 'crm/base_crm.html' %}
{% block content %}
<h2>Удалить контакт?</h2>
<p><strong>{{ contact.full_name }}</strong> ({{ contact.company.name }})</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Удалить</button>
    <a href="{% url 'crm:company_detail' pk=contact.company.pk %}" class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
