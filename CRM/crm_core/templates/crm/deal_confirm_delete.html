{% extends 'crm/base_crm.html' %}
{% block content %}
<h2>Удалить сделку?</h2>
<p><strong>{{ deal.title }}</strong> ({{ deal.company.name }})</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Удалить</button>
    <a href="{% url 'crm:deal_detail' pk=deal.pk %}" class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
